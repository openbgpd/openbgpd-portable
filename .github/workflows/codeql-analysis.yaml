name: CodeQL analysis

on:
  push:
  pull_request:
  schedule:
    # build the main branch every Monday morning
    - cron: '22 5 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d #v4.38.3
      with:
        languages: ${{ matrix.language }}
    - name: Build Application using script
      run: |
        sudo apt-get update
        sudo apt-get install libevent-dev
        ./autogen.sh
        ./configure
        make
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee #v4.39.0
      with:
        category: "/language:${{matrix.language}}"
