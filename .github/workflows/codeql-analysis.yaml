name: CodeQL analysis

on:
  push:
  pull_request:
  schedule:
    # build the main branch every Monday morning
    - cron: '22 5 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 #v4.39.1
      with:
        languages: ${{ matrix.language }}
    - name: Build Application using script
      run: |
        sudo apt-get update
        sudo apt-get install libevent-dev
        ./autogen.sh
        ./configure
        make
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 #v4.39.2
      with:
        category: "/language:${{matrix.language}}"
